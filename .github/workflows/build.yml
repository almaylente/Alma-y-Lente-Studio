
name: Construir Alma y Lente Studio

on:
  workflow_dispatch:
  push:
    paths:
      - 'Alma_y_Lente_Studio_Android.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar Android
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Instalar herramientas Android
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extraer proyecto
        run: unzip Alma_y_Lente_Studio_Android.zip

      - name: Compilar APK
        run: |
          cd Alma_y_Lente_Studio_Android
          gradle --no-daemon assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Alma-y-Lente-Studio-APK
          path: Alma_y_Lente_Studio_Android/app/build/outputs/apk/debug/app-debug.apk
